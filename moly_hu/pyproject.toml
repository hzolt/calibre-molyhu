[build-system]
requires = ['setuptools', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'molyhu'
version = '3.1.0'
description = 'Moly.hu metadata scraper'
authors = [
    {name = 'Imre NAGY'},
]

dependencies = [
    'lxml'
]

requires-python = '>=3.8'

[project.optional-dependencies]
dev = ['pytest', 'flake8']

[project.urls]
Homepage = 'https://github.com/hzolt/calibre-molyhu'

[tool.isort]
profile = "black"
src_paths = ["moly_hu/src", "moly_hu/tests", "calibre", "calibre-web"]
