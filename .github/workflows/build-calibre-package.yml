name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  createCalibrePackage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
        cache: 'pip'
        cache-dependency-path: 'moly_hu/pyproject.toml'

    - name: Install dependencies
      run: |
        pip install ./moly_hu[dev]

    - name: Lint
      run: |
        flake8

    - name: Test with pytest
      run: |
        pytest -v moly_hu/tests/

    - name: Create calibre package
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        mkdir -p output
        bash ./scripts/create_plugin_zip.sh calibre ./ ./output/Calibre_Moly_hu-${{github.ref_name}}.zip ${{github.ref_name}}

    - name: Create calibre translator package
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        mkdir -p output
        bash ./scripts/create_plugin_zip.sh translator ./ ./output/Calibre_Moly_hu_Translator-${{github.ref_name}}.zip ${{github.ref_name}}

    - name: Create calibre-web package
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        mkdir -p output
        bash ./scripts/create_plugin_zip.sh calibreweb ./ ./output/Calibre-web_Moly_hu-${{github.ref_name}}.zip ${{github.ref_name}}

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        files: ./output/*
